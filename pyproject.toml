[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src", "lib"]

[project]
name = "ytorchplugin"
version = "0.1.0"
dependencies = [
    "nodeserver",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchinfo>=1.8.0",
    "matplotlib>=3.11.2",
    "platformdirs>=4.14.5"
]

[tool.setuptools.dynamic]
dependencies = {file = ["./lib/nodeserver/requirements.txt"]}

[tool.uv.sources]
nodeserver = { path = "./lib/nodeserver", editable = true }

[tool.poetry.dependencies]
nodeserver = { path = "./lib/nodeserver", develop = true }