[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src", "lib"]

[project]
name = "ytorchplugin"
version = "0.1.0"
dependencies = [
    "nodeblocks",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchinfo>=1.8.0",
    "matplotlib>=3.11.2"
]

[tool.setuptools.dynamic]
dependencies = {file = ["./lib/nodeblocks/requirements.txt"]}

[tool.uv.sources]
nodeblocks = { path = "./lib/nodeblocks", editable = true }

[tool.poetry.dependencies]
nodeblocks = { path = "./lib/nodeblocks", develop = true }